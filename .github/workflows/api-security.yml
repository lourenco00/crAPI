name: API Security (OpenAPI-driven) - crAPI (Spectral + Schemathesis)

on:
  workflow_dispatch:
  push:
    branches: ["main", "master", "develop"]

jobs:
  api-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl python3-pip npm
          pip install --upgrade pip

      - name: Show Docker & Compose versions
        run: |
          docker --version
          docker compose version || true

      - name: Create default Spectral ruleset if missing
        run: |
          if [ ! -f .spectral.yaml ]; then
            cat > .spectral.yaml <<'YAML'
          extends:
            - "spectral:oas"
          YAML
          fi
          echo "Using .spectral.yaml:"
          cat .spectral.yaml

      - name: Prepare report files
        run: |
          echo "[]" > spectral-report.json
          echo "{}" > schemathesis-report.json
          echo "" > compose-path.txt

      - name: Find docker compose file
        run: |
          set -euxo pipefail
          find . -maxdepth 6 -type f \( -name "docker-compose.yml" -o -name "docker-compose.yaml" -o -name "compose.yml" -o -name "compose.yaml" \) -print
          COMPOSE_FILE="$(find . -maxdepth 6 -type f \( -name "docker-compose.yml" -o -name "docker-compose.yaml" -o -name "compose.yml" -o -name "compose.yaml" \) | head -n 1)"
          if [ -z "$COMPOSE_FILE" ]; then
            echo "No docker compose file found in repo."
            ls -la
            exit 1
          fi
          echo "COMPOSE_FILE=$COMPOSE_FILE"
          echo "$COMPOSE_FILE" > compose-path.txt

      - name: Start crAPI via Docker Compose
        run: |
          set -euxo pipefail
          COMPOSE_FILE="$(cat compose-path.txt)"
          docker compose -f "$COMPOSE_FILE" pull
          docker compose -f "$COMPOSE_FILE" up -d
          docker ps -a

      - name: Wait for crAPI to be ready (best-effort)
        run: |
          set -euxo pipefail

          # Try a few common ports used by crAPI deployments
          CANDIDATES=("http://localhost:8888" "http://localhost:8080" "http://localhost:80" "http://localhost:3000")

          for base in "${CANDIDATES[@]}"; do
            echo "Testing base URL: $base"
            for i in {1..20}; do
              if curl -fsS "$base/" >/dev/null 2>&1; then
                echo "CRAPI_BASE_URL=$base" >> $GITHUB_ENV
                echo "crAPI is up at $base"
                exit 0
              fi
              sleep 3
            done
          done

          echo "Could not confirm crAPI readiness on common ports."
          echo "Dumping container logs (tail):"
          COMPOSE_FILE="$(cat compose-path.txt)"
          docker compose -f "$COMPOSE_FILE" logs --no-color | tail -n 200 || true
          # Don't fail hard here; sometimes UI isn't on these ports but APIs still run.
          echo "Continuing anyway..."

      - name: Locate OpenAPI spec
        run: |
          set -euxo pipefail

          # crAPI repo usually contains openapi-spec/crapi-openapi-spec.json
          if [ -f openapi-spec/crapi-openapi-spec.json ]; then
            echo "OPENAPI_SPEC=openapi-spec/crapi-openapi-spec.json" >> $GITHUB_ENV
            exit 0
          fi

          # fallback: search
          SPEC="$(find . -maxdepth 6 -type f \( -name "*openapi*.json" -o -name "*openapi*.yaml" -o -name "*openapi*.yml" \) | head -n 1)"
          if [ -z "$SPEC" ]; then
            echo "No OpenAPI spec found."
            find . -maxdepth 6 -type f | head -n 200
            exit 1
          fi

          echo "Found OpenAPI spec: $SPEC"
          echo "OPENAPI_SPEC=$SPEC" >> $GITHUB_ENV

      - name: Install Spectral
        run: |
          npm install -g @stoplight/spectral-cli
          spectral --version

      - name: Run Spectral (OpenAPI lint)
        run: |
          set -euxo pipefail
          spectral lint "$OPENAPI_SPEC" \
            --ruleset .spectral.yaml \
            --format json \
            --output spectral-report.json
        continue-on-error: true

      - name: Install Schemathesis
        run: |
          pip install schemathesis
          schemathesis --version

      - name: Run Schemathesis (schema-based testing)
        run: |
          set -euxo pipefail

          BASE_URL="${CRAPI_BASE_URL:-http://localhost:8888}"
          echo "Using base URL: $BASE_URL"
          echo "Using spec: $OPENAPI_SPEC"

          # Schemathesis uses --url (not --base-url / --schema)
          schemathesis run "$OPENAPI_SPEC" \
            --url "$BASE_URL" \
            --checks all \
            --max-examples 50 \
            --report json \
            --report-file schemathesis-report.json 
        continue-on-error: true

      - name: Dump crAPI logs (tail)
        if: always()
        run: |
          set -euxo pipefail
          COMPOSE_FILE="$(cat compose-path.txt)"
          docker compose -f "$COMPOSE_FILE" ps || true
          docker compose -f "$COMPOSE_FILE" logs --no-color | tail -n 400 || true

      - name: Upload API security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-security-results
          path: |
            spectral-report.json
            schemathesis-report.json
            compose-path.txt
