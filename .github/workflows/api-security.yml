name: API Security (OpenAPI-driven) - crAPI

on:
  workflow_dispatch:
  push:
    branches: ["master", "main", "develop"]

jobs:
  api-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl python3-pip npm
          pip install --upgrade pip

      - name: Show Docker & Compose versions
        run: |
          docker --version
          docker compose version || true

      - name: Prepare report files
        run: |
          echo "[]" > spectral-report.json
          echo "{}" > schemathesis-report.json

      # --------------------
      # Start crAPI
      # --------------------
      - name: Start crAPI via Docker Compose
        run: |
          docker compose pull
          docker compose up -d

      - name: Wait for crAPI to be ready
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8888/ >/dev/null; then
              echo "crAPI is up!"
              exit 0
            fi
            echo "Waiting for crAPI... ($i/60)"
            sleep 5
          done
          echo "crAPI did not become ready in time"
          docker ps -a || true
          docker compose logs --no-color | tail -n 200 || true
          exit 1

      # --------------------
      # Spectral
      # --------------------
      - name: Install Spectral
        run: |
          npm install -g @stoplight/spectral-cli
          spectral --version

      - name: Run Spectral (OpenAPI lint)
        run: |
          spectral lint openapi-spec/crapi-openapi-spec.json \
            --ruleset .spectral.yaml \
            --format json \
            --output spectral-report.json
        continue-on-error: true

      # --------------------
      # Schemathesis
      # --------------------
      - name: Install Schemathesis
        run: |
          pip install schemathesis
          schemathesis --version

      - name: Run Schemathesis (schema-based testing)
        run: |
          schemathesis run openapi-spec/crapi-openapi-spec.json \
            --url http://localhost:8888 \
            --checks all \
            --max-examples 50 \
            --report json \
            --report-file schemathesis-report.json
        continue-on-error: true

      # --------------------
      # Logs + artifacts
      # --------------------
      - name: Dump crAPI logs (tail)
        if: always()
        run: |
          docker compose logs --no-color | tail -n 300 || true

      - name: Upload API security reports
        uses: actions/upload-artifact@v4
        with:
          name: api-security-results
          path: |
            spectral-report.json
            schemathesis-report.json
